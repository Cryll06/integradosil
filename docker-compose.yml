services:

  web:

    build: .
    command: sh -c "python wait_for_db.py && python manage.py makemigrations calificaciones && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app
    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:

        condition: service_healthy

  
  db:
    image: gvenzl/oracle-xe:21-slim
    ports:
      - "1522:1521" 
    env_file:
      - .env
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10


volumes:
  oracle_data: